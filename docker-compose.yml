version: '3.8'

services:
  # Registry services
  flatpak-registry:
    build: ./registries/flatpak
    container_name: flatpak-registry
    ports:
      - "8080:8080"
    networks:
      - default

  snap-registry:
    build: ./registries/snap
    container_name: snap-registry
    ports:
      - "8081:8081"
    networks:
      - default

  deb-registry:
    build: ./registries/deb
    container_name: deb-registry
    ports:
      - "8082:8082"
    networks:
      - default

  rpm-registry:
    build: ./registries/rpm
    container_name: rpm-registry
    ports:
      - "8083:8083"
    networks:
      - default

  # Consumer services
  consumer-arch:
    build:
      context: consumers
      dockerfile: arch-flatpak/Dockerfile
    container_name: consumer-arch
    depends_on:
      - flatpak-registry
    ports:
      - "9001:9000"
    privileged: true  # Required for flatpak/bwrap user namespaces
    networks:
      - default

  consumer-debian:
    build:
      context: consumers
      dockerfile: debian-apt/Dockerfile
    container_name: consumer-debian
    depends_on:
      - deb-registry
    ports:
      - "9003:9000"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ./wpt-reports/crash-dumps:/tmp/crash-dumps:Z
    ulimits:
      nproc: 65535
    networks:
      - default

  consumer-redhat:
    build:
      context: consumers
      dockerfile: redhat-rpm/Dockerfile
    container_name: consumer-redhat
    depends_on:
      - rpm-registry
    ports:
      - "9004:9000"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
    networks:
      - default

  # Builder service
  builder:
    image: builder:latest
    build:
      context: .
      dockerfile: builder/Dockerfile
    container_name: builder
    privileged: true  # Required for flatpak build operations
    userns_mode: keep-id
    environment:
      - ENABLED_CONSUMERS=${ENABLED_CONSUMERS:-}
    volumes:
      - ./dist:/home/builder/output:U
    ports:
      - "8888:8888"
      - "9999:9999"
    networks:
      - default

networks:
  default:
    external: true
    name: podman-build-network
